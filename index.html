<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="業界・会社・役職のタンスを開けていくと、インターンや内定までのロードマップを3通り提示する就活ツール。国内の就活とキャリアフォーラムに対応。">
<title>就活キャビネット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a honey-wood chest of drawers (industries) → a wooden bookshelf of big companies → role index cards → three roadmap routes. */
:root{
  --bg:#ecebe6; --ink:#211c18; --muted:#635b54;
  --line:#c9c1b6; --card:#fdfcf9; --rule:#c3d5e6; --red:#c13f2e;
  --brass:#9a7330; --accent:#2c5c4f; --accent-soft:#d9e6e0;
  --wood:#d08a45; --wood-2:#bb7433; --wood-hi:rgba(255,236,200,.35); --wood-deep:#5a2e0e;
  --wood-top:#e3a35e; --wood-top-2:#c98742; --wood-side:#a8622a; --wood-side-2:#8a4c1d; --wood-ink:#5a2c0b;
  --wood-back:#7a4318; --wood-back-2:#5e3110;
  --grain:rgba(110,50,10,.20); --grain-2:rgba(255,230,190,.12);
  --b1:#1f3b57; --b2:#6b1f24; --b3:#2f4a35; --b4:#3c2f4f; --b5:#8a6a2e; --b6:#2a2a2a; --b-ink:#f3e9d4; --b-gold:#d4b06a;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151311; --ink:#ebe5de; --muted:#a39a90; --line:#3a342e; --card:#1f1c19; --red:#e26b59;
  --brass:#c9a45a; --accent:#82bca8; --accent-soft:#22342e;
  --wood:#b8773a; --wood-2:#a0632b; --wood-hi:rgba(255,226,180,.22); --wood-deep:#3e1f08;
  --wood-top:#c88a48; --wood-top-2:#ad6f33; --wood-side:#8a4f20; --wood-side-2:#6e3c15; --wood-back:#4f2a0e; --wood-back-2:#3a1e09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151311; --ink:#ebe5de; --muted:#a39a90; --line:#3a342e; --card:#1f1c19; --red:#e26b59;
  --brass:#c9a45a; --accent:#82bca8; --accent-soft:#22342e;
  --wood:#b8773a; --wood-2:#a0632b; --wood-hi:rgba(255,226,180,.22); --wood-deep:#3e1f08;
  --wood-top:#c88a48; --wood-top-2:#ad6f33; --wood-side:#8a4f20; --wood-side-2:#6e3c15; --wood-back:#4f2a0e; --wood-back-2:#3a1e09; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:36px;width:100%}
h1,h2,h3{text-wrap:balance;margin:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{font-size:12.5px;color:var(--muted);margin:0;max-width:60em}

header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:.02em}
header p{margin:8px 0 0;color:var(--muted);max-width:36em}
.profile{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg span.label{width:5.5em}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tab{border:none;background:transparent;padding:10px 18px;font-weight:700;cursor:pointer;border-radius:4px 4px 0 0;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab small{display:block;font-weight:400;font-size:11.5px;opacity:.75}

.step-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.step-head .n{font-family:var(--mono);font-size:12px;color:var(--brass)}
.step-head h2{font-size:19px;font-weight:700}
.step-head .hint{font-size:13px;color:var(--muted)}

/* forums */
.forums{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.ticket{text-align:left;cursor:pointer;border:1px dashed var(--line);background:var(--card);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ticket[aria-pressed="true"]{border:2px solid var(--accent);box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
.ticket .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket b{font-size:17px}
.ticket .count{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
.ticket .count.hot{background:var(--red);color:var(--card)}
.ticket .meta{font-size:13px;color:var(--muted)}
.ticket .date{font-family:var(--mono);font-size:13px}

/* chest: oblique 2.5D — side face left, top face above, drawer grid in front */
.stage{display:flex;justify-content:center}
.chest{--D:34px;--T:24px;position:relative;width:100%;max-width:560px;padding:var(--T) 0 0 var(--D);filter:drop-shadow(0 22px 18px rgba(0,0,0,.28))}
.c-top{position:absolute;inset:0 0 auto 0;height:calc(var(--T) + 1px);clip-path:polygon(0 0,calc(100% - var(--D)) 0,100% 100%,var(--D) 100%);
  background:repeating-linear-gradient(176deg,transparent 0 5px,var(--grain) 5px 6px,transparent 6px 14px),linear-gradient(90deg,var(--wood-top-2),var(--wood-top))}
.c-side{position:absolute;left:0;top:0;bottom:0;width:calc(var(--D) + 1px);clip-path:polygon(0 0,100% var(--T),100% 100%,0 calc(100% - var(--T)));
  background:repeating-linear-gradient(180deg,transparent 0 7px,var(--grain) 7px 8px,transparent 8px 19px),linear-gradient(90deg,var(--wood-side-2),var(--wood-side))}
.c-front{position:relative;background:linear-gradient(180deg,var(--wood-2),var(--wood-side));padding:0 10px}
.c-lip{height:12px;margin:0 -10px 8px;background:linear-gradient(180deg,var(--wood-top),var(--wood));box-shadow:0 2px 2px rgba(0,0,0,.25)}
.c-base{height:22px;margin:8px -10px 0;background:linear-gradient(180deg,var(--wood),var(--wood-2));box-shadow:inset 0 2px 2px rgba(0,0,0,.25),inset 0 -2px 0 var(--wood-deep)}
.drawers{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tdrawer{--gx:30%;position:relative;cursor:pointer;border:none;border-radius:3px;min-height:74px;padding:10px 12px 22px;
  background:
    repeating-radial-gradient(ellipse 160% 46% at var(--gx) 135%,transparent 0 9px,var(--grain) 9px 10px,transparent 10px 15px,var(--grain-2) 15px 16px),
    radial-gradient(ellipse at 25% 30%,var(--wood-hi),transparent 65%),
    linear-gradient(180deg,var(--wood),var(--wood-2));
  box-shadow:inset 1px 1px 0 var(--wood-hi),inset -1px -2px 0 rgba(0,0,0,.18),0 0 0 2px rgba(40,18,4,.55);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s ease}
.tdrawer.full{grid-column:1 / -1;min-height:82px}
.tdrawer:nth-child(2n){--gx:70%}.tdrawer:nth-child(3n){--gx:50%}
.tdrawer:hover{transform:translate(2px,2px)}
.tdrawer[aria-pressed="true"]{transform:translate(18px,13px);z-index:2;
  box-shadow:inset 1px 1px 0 var(--wood-hi),inset -1px -2px 0 rgba(0,0,0,.18),-6px -5px 0 0 var(--wood-side-2),0 14px 18px -6px rgba(0,0,0,.55)}
.engrave{font-weight:700;font-size:15px;color:var(--wood-ink);text-shadow:0 1px 0 var(--wood-hi);letter-spacing:.08em}
.engrave small{font-family:var(--mono);font-weight:500;font-size:10.5px;margin-left:6px;letter-spacing:0}
.pull{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:28%;max-width:120px;height:11px;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;background:linear-gradient(180deg,var(--wood-deep),var(--wood-2));box-shadow:inset 0 3px 3px rgba(0,0,0,.55),0 1px 0 var(--wood-hi)}
.tdrawer.half .pull{width:40%}
@media (max-width:480px){.chest{--D:22px;--T:16px}.engrave{font-size:13.5px}}

/* bookshelf of companies */
.shelf{max-width:860px;margin:0 auto;padding:14px 14px 0;border-radius:3px;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.12) 11px 12px,transparent 12px 27px),linear-gradient(180deg,var(--wood-back-2),var(--wood-back));
  box-shadow:inset 14px 0 0 var(--wood-side),inset -14px 0 0 var(--wood-side),inset 0 14px 0 var(--wood-side),inset 0 30px 22px -14px rgba(0,0,0,.55),0 18px 24px -16px rgba(0,0,0,.5)}
.shelf-title{display:flex;justify-content:center;padding:4px 0 12px}
.shelf-title span{background:var(--b-gold);color:#2a1d0c;font-weight:700;font-size:13px;padding:3px 14px;border-radius:2px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.row{position:relative;display:flex;align-items:flex-end;gap:4px;padding:16px 22px 0;overflow-x:auto;overflow-y:hidden;min-height:150px}
.board{height:16px;margin:0 0 14px;background:linear-gradient(180deg,var(--wood-top),var(--wood) 55%,var(--wood-2));box-shadow:0 6px 8px -3px rgba(0,0,0,.55)}
.shelf .board:last-child{margin-bottom:0;height:20px}
.book{flex:none;writing-mode:vertical-rl;text-orientation:mixed;cursor:pointer;border:none;border-radius:3px 3px 1px 1px;
  width:46px;min-height:var(--h,170px);padding:22px 0 16px;display:flex;align-items:center;justify-content:flex-start;
  background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 30%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.4)),var(--c);
  color:var(--b-ink);font-weight:700;font-size:13.5px;letter-spacing:.06em;position:relative;
  box-shadow:inset 0 10px 0 -7px var(--b-gold),inset 0 -12px 0 -8px var(--b-gold);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);animation:slide .45s cubic-bezier(.2,.8,.3,1) backwards}
.book.wide{width:54px}
.book:hover{transform:translateY(-5px)}
.book[aria-pressed="true"]{transform:translateY(-22px);box-shadow:inset 0 10px 0 -7px var(--b-gold),inset 0 -12px 0 -8px var(--b-gold),0 0 0 2px var(--b-gold),0 10px 16px -6px rgba(0,0,0,.7)}
@keyframes slide{from{transform:translateY(-14px)}to{transform:none}}
.shelf-note{max-width:860px;margin:10px auto 0}

/* role cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.icard{text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:2px;padding:0 16px 14px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);background-position:0 38px;
  box-shadow:0 2px 0 var(--line);transition:transform .2s ease;min-width:0;position:relative}
.icard::before{content:"";display:block;height:2px;background:var(--red);margin:0 -16px;position:relative;top:36px}
.icard:hover{transform:translateY(-3px)}
.icard[aria-pressed="true"]{transform:translateY(-8px);box-shadow:0 0 0 2px var(--accent),0 8px 16px -8px rgba(0,0,0,.4)}
.icard .top{display:flex;justify-content:space-between;align-items:center;height:38px}
.icard .top b{font-size:16px}
.icard .top em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.icard p{margin:6px 0 8px;font-size:13.5px;line-height:26px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:2px;background:var(--accent-soft)}
.pick{position:absolute;right:10px;bottom:10px;font-family:var(--mono);font-size:10px;color:var(--accent)}

/* result */
.summary{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px 40px;border-top:3px solid var(--ink);padding-top:18px}
@media (max-width:720px){.summary{grid-template-columns:1fr}}
.summary h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,30px);line-height:1.25}
.summary h2 small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500;margin-bottom:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
@media (max-width:900px){.routes{grid-template-columns:1fr}}
.route{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.route.rec{border:2px solid var(--accent)}
.route-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.route-head h3{font-size:17px}
.route-head .label{display:block;margin-bottom:2px}
.badge{flex:none;font-size:11.5px;font-weight:700;background:var(--accent);color:var(--bg);padding:2px 9px;border-radius:999px}
.route .who{font-size:13px;color:var(--muted);margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{position:relative;padding:0 0 16px 22px;border-left:2px solid var(--line);margin-left:5px}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.steps li.goal::before{background:var(--accent)}
.when{font-family:var(--mono);font-size:11.5px;color:var(--brass);display:block}
.steps b{display:block;font-size:14.5px}
.steps p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}

/* matryoshka stage */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-bottom:18px;font-size:13.5px}
.crumb{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;cursor:pointer}
.crumb[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink);cursor:default}
.crumbs .sep{color:var(--muted)}
.depth{display:flex;align-items:center;gap:8px;justify-content:center;margin:0 0 14px;color:var(--muted);font-size:13px}
.depth i{display:inline-block;border:2px solid var(--wood-2);border-radius:2px}
.depth i.on{background:var(--wood)}
.view{transform-origin:50% 40%}
.view.leave{animation:dive .45s cubic-bezier(.5,0,.8,.4) forwards}
.view.enter{animation:emerge .55s cubic-bezier(.2,.9,.3,1.15)}
@keyframes dive{to{transform:scale(1.9) translateY(8%);opacity:0}}
@keyframes emerge{from{transform:scale(.3) translateY(18%);opacity:.2}to{transform:none;opacity:1}}
.chest.lv1{max-width:500px;filter:drop-shadow(0 22px 18px rgba(0,0,0,.28)) saturate(.92) brightness(.86)}
.chest.lv2{max-width:440px;filter:drop-shadow(0 22px 18px rgba(0,0,0,.28)) saturate(.85) brightness(.74) hue-rotate(-6deg)}
.engrave{white-space:normal;text-align:center;line-height:1.35}
.sub{font-size:11.5px;color:var(--wood-ink);opacity:.8}
.back{margin-top:20px;display:flex;justify-content:center}
.back button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="label">Internship Roadmap Cabinet</div>
      <h1>就活キャビネット</h1>
      <p id="lede"></p>
    </div>
    <div class="profile" id="profile">
      <div class="seg" role="group" aria-label="学年"><span class="label">学年</span>
        <button class="chip" id="g-early" data-grade="early">学部1・2年</button>
        <button class="chip" id="g-mid" data-grade="mid">学部3年 / 修士1年</button>
      </div>
      <div class="seg" role="group" aria-label="重視すること"><span class="label">重視</span>
        <button class="chip" id="f-a" data-focus="A">内定への近さ</button>
        <button class="chip" id="f-b" data-focus="B">実務スキル</button>
        <button class="chip" id="f-c" data-focus="C">視野を広げたい</button>
      </div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-dom" data-mode="dom">国内の就活<small>業界のタンス</small></button>
    <button class="tab" role="tab" id="tab-abr" data-mode="abr">留学生<small>キャリアフォーラムのタンス</small></button>
  </div>

  <div id="mode-dom" class="wrap">
    <section id="d-stage"></section>
  </div>

  <div id="mode-abr" class="wrap" hidden>
    <section>
      <div class="step-head"><span class="n">STEP 1</span><h2>今住んでいる地域とフォーラム</h2></div>
      <div class="seg" id="regions" role="group" aria-label="地域"></div>
      <div class="forums" id="forums"></div>
    </section>
    <section id="a-stage"></section>
  </div>
</div>

<script>
/* ===== 国内：業界ごとの会社と役職 ===== */
const COMPANIES = [
 {id:"shosha", name:"総合商社", size:"half", firms:["三菱商事","三井物産","伊藤忠商事","住友商事","丸紅","豊田通商","双日"], roles:[
  {name:"営業（トレーディング）", en:"Trading", line:"資源・食料・機械などを国をまたいで売り買いし、取引をまとめる。", skills:["交渉力","数字の感覚","英語"],
   prep:"商社の事業ポートフォリオを比較し、1つの事業を深掘りしておく", short:"数日間のグループワーク型。新規事業立案やケースが中心", long:"貿易実務や海外営業を扱う中小商社・メーカーの長期インターン",
   output:"担当した取引・資料作成の件数と、自分が動いて変わった数字", selection:"インターン参加者向けの早期面談がある会社が多い。面接は人物重視", alt:"学生向けビジネスコンテストや海外ボランティアで「現場を動かした経験」を作る"},
  {name:"事業投資", en:"Investment", line:"企業や事業に出資し、経営に入って価値を上げる。", skills:["財務分析","論理思考","当事者意識"],
   prep:"簿記3級〜2級レベルの財務の基礎とPL/BSの読み方", short:"投資判断をグループで行うケース型", long:"VC・PEファンドやスタートアップの経営企画の長期インターン",
   output:"作った事業計画・財務モデルと、その判断が使われた場面", selection:"ケース面接や財務の基礎知識を問われることがある", alt:"投資サークルや企業分析コンテストで分析の実績を作る"},
  {name:"コーポレート（経理・法務）", en:"Corporate", line:"財務・法務・人事で会社全体を支える。", skills:["正確さ","専門知識","調整力"],
   prep:"簿記2級や法学の基礎など専門性の入口を固める", short:"事業部門と合同のプログラムが多い", long:"会計事務所・法務系スタートアップの長期インターン",

as.lv = as.lv ?? 0;
const DOW="日月火水木金土";
const today=()=>{const d=new Date(); d.setHours(0,0,0,0); return d;};
const toD=s=>{const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);};
const addD=(d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const fmt=d=>`${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;
const daysTo=f=>!f.start?999:Math.round((toD(f.start)-today())/86400000);
function countLabel(f){ if(!f.start) return {t:"日程未発表",hot:false}; const n=daysTo(f), en=Math.round((toD(f.end)-today())/86400000);

      <span class="meta">${esc(f.venue)}</span></button>`;}).join("");
}
const NEXT={kinki:"jetro",jetro:"cfair",cfair:"kinki",asean:"tkw",bos:"tkw",tkw:"lon",lon:"los",los:"tks",tks:"osk",osk:"tkf",tkf:"bos"};

  const preWhen = !known ? "開催の2〜6週間前" : n>14 ? `${fmt(t)}〜${fmt(addD(s,-14))}ごろ` : (n>0?"今日〜締切まで":"次回に向けて");

      [D,"会場で面接",r.tip],
      [`${DE}〜2週間後`,"最終面接・内定","会期中に面接を重ね、最終日までに内定を出す会社もある。夜の食事会や別会場での面接に呼ばれることもあるので、予定を空けておく"]]},
    {k:"B",tag:"Route B",title:"当日ウォークインルート",who:"事前応募が間に合わなくても、当日ブースで勝負する。",steps:[
      [known&&n>0?`今日〜${fmt(addD(s,-1))}`:"開催まで","英日で1分の自己紹介を作る",`見られる力は${r.skills.join("・")}。留学で一番大きく変わった経験を軸にする`],
      [`${D0} 開場直後`,`${firm}のブースへ`,"当日受付をしている会社もある。人が少ない開場直後が狙い目。レジュメは多めに印刷して持っていく"],
      [D,"その場で面接・次の面接の約束",r.tip],
      [`${DE}〜`,"内定へ","会期後にオンラインで最終面接をする会社もある。連絡はすぐ返す"]]},
    {k:"C",tag:"Route C",title:"次の会場で勝負ルート",who:`今回は下見にして、${nx.short}で本番を迎える。`,steps:[
      [n>0?D:"今から",n>0?`${f.short}で下見・情報収集`:"オンライン説明会に参加",`${firm}の社員に「${r.name}」の仕事内容と、評価される人の特徴を聞く`],
      ["その後の数か月","経験を足して、話す内容を作る",`足りない力（${r.skills.join("・")}）を、授業・インターン・課外活動で補う。英日両方のレジュメを更新`],
      [nxKnown?`${fmt(addD(toD(nx.start),-42))}〜`:"開催の2〜6週間前",`${nx.short}に事前応募`,`${nxLabel}の出展企業を確認し、${firm}が出るか、近い会社も含めて応募する`],
      [nxKnown?fmt(toD(nx.start)):nx.when,"本番で内定へ",r.tip]]}
  ];
  if(f.kind==="intl"){
    const visa=f.id==="asean"?"日本で働くには、働ける在留資格（技術・人文知識・国際業務など）の取得が必要。内定後に会社と手続きを進める":"内定後は、在留資格を「留学」から働ける資格（技術・人文知識・国際業務など）に変える手続きが必要。会社の人事と早めに進める";
    routes[0].steps[0]=[routes[0].steps[0][0],`${f.site}で参加申し込み`,`日本語の履歴書と自己PRを用意。日本語のレベル（JLPTなど）をはっきり書く。${firm}の採用ページも見ておく`];

  }

function aStage(){
  const f=FORUMS[as.forum], ind=aInd(), roles=AROLES[ind.id];
  if(as.firm>=ind.firms.length) as.firm=0; if(as.role>=roles.length) as.role=0;

}

/* ===== stage rendering with matryoshka transition ===== */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function paint(scope, anim){
  const v = scope==="d"?dStage():aStage();
  const host = $(`#${scope}-stage`);
  host.innerHTML = `${v.crumbs}${v.head}<div class="view${anim?" enter":""}">${v.lv<3?depthHTML(v.lv):""}${v.body}${backHTML(scope,v.lv)}</div>`;
}
let busy=false;
function advance(scope, apply){
  const host=$(`#${scope}-stage`), view=host.querySelector(".view");
  if(busy) return; busy=true;
  const finish=()=>{ apply(); save(); paint(scope,!reduce); busy=false; host.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); };
  if(reduce||!view){ finish(); return; }
  setTimeout(()=>{ view.classList.add("leave"); setTimeout(finish,430); },260);
}

function renderMode(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===mode));
  $("#mode-dom").hidden=mode!=="dom"; $("#mode-abr").hidden=mode!=="abr"; $("#profile").hidden=mode!=="dom";
  $("#lede").textContent = mode==="dom"
    ? "タンスの引き出しを開けると、中から次のタンスが出てきます。業界、会社、役職と開けていくと、インターンのロードマップが3通り出ます。"
    : "海外の大学で学ぶ人も、日本で学ぶ外国人留学生も。地域からキャリアフォーラムを選び、出展企業のタンスを開けていく。業界、会社、役職と開けると、内定までのロードマップが3通り出ます。";
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const d=t.dataset, S=d.scope;
  if(d.mode){ mode=d.mode; renderMode(); save(); return; }
  if(d.grade){ ds.grade=d.grade; renderChips(); if(ds.lv===3) paint("d"); save(); return; }
  if(d.focus){ ds.focus=d.focus; renderChips(); if(ds.lv===3) paint("d"); save(); return; }
  if(d.region){ as.region=d.region; as.forum=REGIONS.find(r=>r.id===as.region).forums[0]; renderRegions(); paint("a"); save(); return; }
  if(d.forum){ as.forum=d.forum; renderRegions(); paint("a"); save(); return; }
  if(d.lv!==undefined && S){ const o=S==="d"?ds:as; o.lv=+d.lv; paint(S,!reduce); save(); return; }
  if(d.pick!==undefined && S){
    const o=S==="d"?ds:as;
    t.setAttribute("aria-pressed","true");
    t.parentElement.querySelectorAll(".tdrawer").forEach(b=>{ if(b!==t) b.setAttribute("aria-pressed","false"); });
    advance(S,()=>{
      if(o.lv===0){ if(o.ind!==d.pick){ o.ind=d.pick; o.firm=0; o.role=0; } }
      else if(o.lv===1){ if(o.firm!==+d.pick){ o.firm=+d.pick; o.role=0; } }
      else if(o.lv===2){ o.role=+d.pick; }
      o.lv=Math.min(3,o.lv+1);
    });
  }
});
renderChips(); renderRegions(); paint("d"); paint("a"); renderMode();
</script>

</body>
</html>
